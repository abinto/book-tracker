<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Page header ── -->
  <header>
    <h1>📚 Book Tracker</h1>
    <p>Keep track of what you're reading.</p>
  </header>

  <main>

    <!-- ── Add-book form ── -->
    <section class="card" id="add-section">
      <h2>Add a Book</h2>

      <form id="book-form" novalidate>

        <!-- Title field -->
        <div class="field">
          <label for="title">Title <span class="required">*</span></label>
          <input type="text" id="title" placeholder="e.g. Atomic Habits" />
          <!-- Validation message shown here by JS -->
          <span class="error-msg" id="title-error"></span>
        </div>

        <!-- Author field -->
        <div class="field">
          <label for="author">Author <span class="required">*</span></label>
          <input type="text" id="author" placeholder="e.g. James Clear" />
          <!-- Validation message shown here by JS -->
          <span class="error-msg" id="author-error"></span>
        </div>

        <!-- Status field -->
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="To read">To read</option>
            <option value="Reading">Reading</option>
            <option value="Finished">Finished</option>
          </select>
        </div>

        <button type="submit" id="add-btn">Add Book</button>

      </form>
    </section>

    <!-- ── Stats bar ── -->
    <section id="stats-bar">
      <!-- Filled in by updateStats() in app.js -->
    </section>

    <!-- ── Search bar ── -->
    <section id="search-section">
    <!-- Visually hidden label connects to #search-input for screen readers -->
      <label for="search-input" class="sr-only">Search books</label>
      <input
        type="search"
        id="search-input"
        placeholder="Search by title or author"
        aria-label="Search books"
      />
    </section>

    <!-- ── Book list ── -->
    <section id="book-list">
      <!-- Book cards injected here by renderBooks() in app.js -->
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
